<header>
  <nav class="navbar navbar-expand-md navbar-light fixed-top sticky-top" style="background-color: var(--global-bg-color); border-bottom: 1px solid var(--global-divider-color);">
    <div class="container">
      <!-- 左侧的标题/主页链接 -->
      <a class="navbar-brand title font-weight-lighter" href="{{ '/' | relative_url }}">
        {% if site.title == "blank" %}
          <span class="font-weight-bold">{{ site.first_name }}</span> {{ site.middle_name }} {{ site.last_name }}
        {% else %}
          {{ site.title }}
        {% endif %}
      </a>

      <!-- 右侧的菜单按钮（手机端） -->
      <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar top-bar"></span>
        <span class="icon-bar middle-bar"></span>
        <span class="bar-bottom"></span>
      </button>

      <!-- 导航栏菜单内容（这里就是我们要改的） -->
      <div class="collapse navbar-collapse text-right" id="navbarNav">
        <ul class="navbar-nav ml-auto flex-nowrap">
          
          <!-- 你可以根据你在 about.md 里设置的 ID 自由添加或删除下面这些 <li> -->
          
          <!-- 关于我 (跳转到最顶部) -->
          <li class="nav-item">
            <a class="nav-link" href="{{ '/' | relative_url }}">About</a>
          </li>

          <!-- 简历 -->
          <li class="nav-item">
            <a class="nav-link" href="{{ '/#cv' | relative_url }}">CV</a>
          </li>

          <!-- 项目 -->
          <li class="nav-item">
            <a class="nav-link" href="{{ '/#projects' | relative_url }}">Projects</a>
          </li>

          <!-- 发表文章 -->
          <li class="nav-item">
            <a class="nav-link" href="{{ '/#publications' | relative_url }}">Publications</a>
          </li>

          <!-- 主题切换按钮 (不要删，留着可以切换日/夜模式) -->
          <li class="toggle-container">
            <button id="light-toggle" title="Change theme">
              <i class="fas fa-moon"></i>
              <i class="fas fa-sun"></i>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
